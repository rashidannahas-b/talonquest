# Fires when the external uptime check fails for > 5 minutes.
# You must create the uptime check itself first (Console → Monitoring →
# Uptime checks → Create, HTTPS, host = your domain, path = "/"); note its ID
# and replace __UPTIME_CHECK_ID__ below or delete this file if you'd rather
# skip the external check.

displayName: "TalonQuest: site is down"
combiner: OR
enabled: true
notificationChannels:
  - __CHANNEL__
conditions:
  - displayName: "Uptime check failing for 5 minutes"
    conditionThreshold:
      filter: |
        metric.type="monitoring.googleapis.com/uptime_check/check_passed"
        resource.type="uptime_url"
        metric.label."check_id"="__UPTIME_CHECK_ID__"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_NEXT_OLDER
          crossSeriesReducer: REDUCE_COUNT_FALSE
          groupByFields:
            - resource.label.project_id
      comparison: COMPARISON_GT
      thresholdValue: 1
      duration: 300s
alertStrategy:
  autoClose: 3600s
documentation:
  mimeType: text/markdown
  content: |
    TalonQuest is not responding to the Cloud Monitoring uptime probe.
    Check `journalctl -u talonquest -u caddy` on the VM.
